# Jaga project Supabase Free tetap aktif.
#
# Supabase menjeda project Free yang 7 hari tanpa "user request ke database"
# (dok: Project Pausing). Trigger/pg_cron di dalam Postgres TIDAK dihitung —
# yang dihitung adalah permintaan dari luar ke API. Workflow ini menembak
# PostgREST 3x per run, 2x sehari, sehingga timer inaktivitas selalu ter-reset.
# Bila query gagal (mis. project kena pause), job jadi merah → notifikasi
# email GitHub sekaligus jadi peringatan dini.
#
# Catatan:
# - Nilai di bawah bersifat PUBLIK — Supabase URL + anon key memang sudah
#   dikirim ke browser lewat NEXT_PUBLIC_* di bundle frontend, jadi aman
#   ditulis langsung di workflow tanpa perlu GitHub Secrets.
# - GitHub menonaktifkan cron workflow bila repo 60 hari tanpa aktivitas —
#   repo ini aktif dikembangkan, tapi cek tab Actions bila lama tak ada commit.
name: Supabase heartbeat

on:
  schedule:
    # 10:23 & 22:23 WIB (03:23 & 15:23 UTC), 2x sehari sebagai jaring pengaman
    - cron: "23 3,15 * * *"
  workflow_dispatch: # jalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase (reset timer inaktivitas)
        env:
          SUPABASE_URL: https://kbjqcbihqavpxazsawti.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtianFjYmlocWF2cHhhenNhd3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNzg5NjYsImV4cCI6MjEwNjc1NDk2Nn0.Soc2evSvWbrch5ipDnc8rFb0Wzh8DemZeRIiiOpIUfI
        run: |
          set -euo pipefail
          # "A few user requests to the database each day" (dok. Supabase):
          # kirim 3 query kecil per run.
          for i in 1 2 3; do
            code=$(curl -sS -o heartbeat-body.json -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            echo "permintaan ${i} -> HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "Heartbeat gagal. Balasan server:" >&2
              cat heartbeat-body.json >&2 || true
              echo "Kemungkinan project paused — cek dashboard Supabase." >&2
              exit 1
            fi
          done
          echo "OK — timer inaktivitas Supabase ter-reset."
